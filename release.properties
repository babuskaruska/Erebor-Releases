# Erebor release settings, copied into every manifest by make_release.py (decision 500).
# host: the live server's address (IP or hostname) the client connects to; required.
host=
# jvm.args: extra Java options for the client (empty = Java's defaults: up to a quarter of the computer's memory).
jvm.args=
# client.args: options for the client (RuneLite's --debug, --no-splash...).
client.args=
# java.local: Java versions the launcher may run the client on directly; any other gets the Temurin 11 runtime.
java.local=11
